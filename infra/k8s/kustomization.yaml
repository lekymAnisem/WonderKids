apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wonderkids

resources:
  - namespace.yaml
  - configmap.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - ingress.yaml

# Default tag for local clusters (minikube/kind). Push to a registry and
# override per environment, e.g.:
#   kustomize edit set image wonderkids-frontend:latest=218619602282.dkr.ecr.ap-southeast-2.amazonaws.com/wonderkids-production-frontend:<tag>
images:
  - name: wonderkids-frontend
    newTag: latest
  - name: wonderkids-backend
    newTag: latest