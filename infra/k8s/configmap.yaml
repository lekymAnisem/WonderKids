apiVersion: v1
kind: ConfigMap
metadata:
  name: wonderkids-config
  namespace: wonderkids
  labels:
    app.kubernetes.io/name: wonderkids
data:
  # Backend
  NODE_ENV: production
  CORS_ORIGIN: "*"
  SEED_ON_BOOT: "true"
  MIGRATIONS_ON_BOOT: "true"
  # Frontend
  FRONTEND_PORT: "3000"
  SESSION_SECRET: wonderkids_fallback_secret
  # Service discovery DNS names
  BACKEND_SERVICE: backend
  FRONTEND_SERVICE: frontend