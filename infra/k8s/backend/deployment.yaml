apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: wonderkids
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: wonderkids
    tier: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: application
    spec:
      containers:
        - name: api
          image: wonderkids-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: wonderkids-config
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: wonderkids-secrets
                  key: SESSION_SECRET
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wonderkids-secrets
                  key: JWT_SECRET
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wonderkids-secrets
                  key: ADMIN_PASSWORD
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi