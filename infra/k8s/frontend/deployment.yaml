apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: wonderkids
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: wonderkids
    tier: presentation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: presentation
    spec:
      containers:
        - name: web
          image: wonderkids-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: wonderkids-config
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: wonderkids-secrets
                  key: SESSION_SECRET
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wonderkids-secrets
                  key: ADMIN_PASSWORD
                  optional: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi