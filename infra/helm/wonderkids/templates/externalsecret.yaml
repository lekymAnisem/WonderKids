{{- if .Values.secrets.externalSecret.enabled }}
{{- $secretName := .Values.secrets.existingSecretName | default .Values.global.existingSecretName | default (printf "%s-secrets" (include "wonderkids.fullname" .)) }}
{{- $eso := .Values.secrets.externalSecret }}
---
# Syncs real credentials from AWS Secrets Manager into the cluster Secret
# using the External Secrets Operator (IRSA: role wonderkids-external-secrets).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $eso.storeName }}
  labels: {{ include "wonderkids.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $eso.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ $eso.serviceAccountName }}
            namespace: {{ $eso.serviceAccountNamespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels: {{ include "wonderkids.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $eso.storeName }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        SESSION_SECRET: {{ "{{ .SESSION_SECRET }}" | quote }}
        JWT_SECRET: {{ "{{ .JWT_SECRET }}" | quote }}
        ADMIN_PASSWORD: {{ "{{ .ADMIN_PASSWORD }}" | quote }}
  data:
    - secretKey: SESSION_SECRET
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: SESSION_SECRET
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: JWT_SECRET
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: ADMIN_PASSWORD
{{- end }}