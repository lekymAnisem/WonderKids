namespace: wonderkids
nameOverride: ''
fullnameOverride: ''
imageRegistry: 218619602282.dkr.ecr.ap-southeast-2.amazonaws.com
global:
  nodeEnv: production
  configMapName: wonderkids-config
  existingSecretName: wonderkids-secrets
secrets:
  # The Secret is created out-of-band, never by this chart, so no credential is
  # ever committed to git. Deployments mount it via envFrom (see deployments.yaml).
  #
  # One-time creation per cluster:
  #   kubectl -n wonderkids create secret generic wonderkids-secrets \
  #     --from-literal=DATABASE_URL='postgresql://...' \
  #     --from-literal=DIRECT_URL='postgresql://...' \
  #     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
  #     --from-literal=JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
  #     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
  #     --from-literal=ADMIN_EMAIL='admin@example.com' \
  #     --from-literal=ADMIN_PASSWORD='...' \
  #     --from-literal=GROQ_API_KEY='...' \
  #     --from-literal=S3_ACCESS_KEY='...' \
  #     --from-literal=S3_SECRET_KEY='...'
  #
  # Non-sensitive settings belong in the config map below or in
  # services.<name>.envVars, not here. Both are mounted through envFrom, so the
  # Secret must not redefine PORT: the two services need different ports.
  create: false
  existingSecretName: wonderkids-secrets
config:
  NODE_ENV: production
  FRONTEND_PORT: '3000'
  CORS_ORIGIN: '*'
  BACKEND_SERVICE: backend
  FRONTEND_SERVICE: frontend
services:
  backend:
    enabled: true
    name: backend
    port: 4000
    replicas: 2
    serviceType: ClusterIP
    service:
      type: ClusterIP
      port: 4000
      targetPort: 4000
    metricsPath: /api/metrics
    image:
      repository: wonderkids-production-backend
      tag: '7'
      pullPolicy: IfNotPresent
    envVars: {}
    livenessProbe:
      enabled: true
      path: /api/health
      port: 4000
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /api/health
      port: 4000
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 3
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  frontend:
    enabled: true
    name: frontend
    port: 3000
    replicas: 2
    serviceType: ClusterIP
    service:
      type: LoadBalancer
      port: 80
      targetPort: 3000
    metricsPath: /metrics
    image:
      repository: wonderkids-production-frontend
      tag: '7'
      pullPolicy: IfNotPresent
    envVars: {}
    livenessProbe:
      enabled: true
      path: /
      port: 3000
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /
      port: 3000
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/use-regex: 'true'
  rules:
    - host: wonderkids.local
      paths:
        - path: /api
          pathType: Prefix
          serviceName: backend
          servicePort: 4000
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80
  tls: []
metrics:
  enabled: true
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  # ServiceMonitor is a Prometheus Operator CRD (monitoring.coreos.com/v1).
  # Metrics are scraped by the standalone Prometheus on the monitoring EC2
  # instance via static_configs, which does not read ServiceMonitor objects.
  # Enabling this makes Argo CD fail the whole sync with
  # "failed to discover server resources for group version monitoring.coreos.com/v1".
  serviceMonitor:
    enabled: false
    labels:
      release: monitoring
serviceAccount:
  create: true
  name: wonderkids
  annotations: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 101
containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
nodeSelector: {}
tolerations: []
affinity: {}
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
