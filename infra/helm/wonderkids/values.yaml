namespace: wonderkids
nameOverride: ''
fullnameOverride: ''
imageRegistry: 218619602282.dkr.ecr.ap-southeast-2.amazonaws.com
global:
  nodeEnv: production
  configMapName: wonderkids-config
  existingSecretName: wonderkids-secrets
secrets:
  create: false
  existingSecretName: wonderkids-secrets
  externalSecret:
    enabled: false
    storeName: wonderkids-aws-secrets-manager
    remoteKey: wonderkids-secrets
    region: ap-southeast-2
    refreshInterval: 1h
    serviceAccountName: external-secrets
    serviceAccountNamespace: external-secrets
config:
  NODE_ENV: production
  PORT: '4000'
  FRONTEND_PORT: '3000'
  CORS_ORIGIN: '*'
  SESSION_SECRET: wonderkids_fallback_secret
  BACKEND_SERVICE: backend
  FRONTEND_SERVICE: frontend
services:
  backend:
    enabled: true
    name: backend
    port: 4000
    replicas: 2
    serviceType: ClusterIP
    service:
      type: ClusterIP
      port: 4000
      targetPort: 4000
    image:
      repository: wonderkids-production-backend
      tag: '12'
      pullPolicy: IfNotPresent
    envVars: {}
    livenessProbe:
      enabled: true
      path: /api/health
      port: 4000
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /api/health
      port: 4000
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 3
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  frontend:
    enabled: true
    name: frontend
    port: 3000
    replicas: 2
    skipMetrics: true
    serviceType: ClusterIP
    service:
      type: LoadBalancer
      port: 80
      targetPort: 3000
    image:
      repository: wonderkids-production-frontend
      tag: '12'
      pullPolicy: IfNotPresent
    envVars: {}
    livenessProbe:
      enabled: true
      path: /
      port: 3000
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /
      port: 3000
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/use-regex: 'true'
  rules:
    - host: wonderkids.local
      paths:
        - path: /api
          pathType: Prefix
          serviceName: backend
          servicePort: 4000
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80
  tls: []
metrics:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  serviceMonitor:
    enabled: false
    labels:
      release: monitoring
serviceAccount:
  create: true
  name: wonderkids
  annotations: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 101
containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
nodeSelector: {}
tolerations: []
affinity: {}
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
